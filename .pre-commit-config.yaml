repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # local + language: node so pre-commit provisions Node itself (mirrors-prettier is archived)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: prettier --write --ignore-unknown
        additional_dependencies: ["prettier@3.3.3"]
        files: ^frontend/
        exclude: ^frontend/(\.next|out|node_modules)/|^frontend/package-lock\.json$|^frontend/next-env\.d\.ts$
